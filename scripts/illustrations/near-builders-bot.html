<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NEAR Builders Bot</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      body {
        display: grid;
        grid-template-columns: 420px 1fr;
      }
      .side {
        padding: 56px 48px;
        border-right: 1px solid var(--rule);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .side h1 {
        font-size: 56px;
        line-height: 0.95;
        letter-spacing: -0.045em;
        font-weight: 600;
      }
      .chat {
        display: flex;
        flex-direction: column;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 28px 40px;
        border-bottom: 2px solid var(--ink);
      }
      .avatar {
        width: 44px;
        height: 44px;
        background: var(--ink);
        display: grid;
        place-items: center;
      }
      .avatar span {
        width: 16px;
        height: 16px;
        background: var(--signal);
      }
      .head strong {
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      .head .mono {
        font-size: 13px;
        color: var(--muted);
      }
      .msgs {
        flex: 1;
        padding: 36px 40px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .msg {
        max-width: 470px;
        padding: 18px 20px;
        display: grid;
        gap: 10px;
      }
      .in {
        background: var(--surface);
      }
      .out {
        align-self: flex-end;
        background: var(--ink);
      }
      .out .bar {
        background: var(--bg);
        opacity: 0.55;
      }
      .cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        max-width: 560px;
      }
      .card {
        border: 1px solid var(--rule);
        border-top: 2px solid var(--ink);
        padding: 16px;
        display: grid;
        gap: 9px;
        background: var(--bg);
      }
      .chip {
        justify-self: start;
        padding: 2px 6px;
        background: var(--signal);
        color: var(--on-signal);
        font-size: 11px;
      }
      .input {
        margin: 0 40px 36px;
        border: 1px solid var(--ink);
        height: 56px;
        display: flex;
        align-items: center;
        padding: 0 18px;
        gap: 4px;
      }
      .caret {
        width: 10px;
        height: 22px;
        background: var(--ink);
      }
    </style>
  </head>
  <body>
    <aside class="side">
      <div class="label" style="color: var(--muted)">Bots · automation</div>
      <h1>An assistant for builders.</h1>
      <div class="mono" style="font-size: 14px; color: var(--muted)">Illustration</div>
    </aside>
    <main class="chat">
      <div class="head">
        <div class="avatar"><span></span></div>
        <div>
          <strong>NEAR Builders Bot</strong>
          <div class="mono">bot</div>
        </div>
      </div>
      <div class="msgs">
        <div class="msg out">
          <div class="bar" style="width: 260px"></div>
          <div class="bar" style="width: 180px"></div>
        </div>
        <div class="msg in">
          <div class="bar ink" style="width: 320px"></div>
          <div class="bar" style="width: 240px"></div>
        </div>
        <div class="cards">
          <div class="card">
            <span class="chip label">Open</span>
            <div class="bar ink" style="width: 70%"></div>
            <div class="bar" style="width: 90%"></div>
            <div class="bar" style="width: 55%"></div>
          </div>
          <div class="card">
            <span class="chip label">Open</span>
            <div class="bar ink" style="width: 60%"></div>
            <div class="bar" style="width: 85%"></div>
            <div class="bar" style="width: 45%"></div>
          </div>
        </div>
        <div class="msg out">
          <div class="bar" style="width: 200px"></div>
        </div>
        <div class="msg in">
          <div class="bar ink" style="width: 280px"></div>
          <div class="bar" style="width: 330px"></div>
          <div class="bar" style="width: 150px"></div>
        </div>
      </div>
      <div class="input">
        <div class="bar" style="width: 200px"></div>
        <div class="caret" style="margin-left: 8px"></div>
      </div>
    </main>
  </body>
</html>
